<style>:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.5);--line:rgba(255,255,255,.22);--red:#ff3b3b;--grn:#3dff8b;--cy:#33e6ff;--mg:#ff3be0;

[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:#000;scroll-behavior:smooth}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}

<script>(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cfg = window.F404_CFG || {};
const CA = (cfg.CA || '').trim();
const T = (cfg.TICKER || '404').replace(/^\$/, '');
const buyUrl = CA ? (cfg.BUY || `https://pump.fun/coin/${CA}`) : '';
const chartUrl = CA ? (cfg.CHART || `https://gmgn.ai/sol/token/${CA}`) : '';
const xUrl = (cfg.X || '').trim();

/* ---------- toast + links ---------- */
const toastEl = $('toast'); let toastT = 0;
function toast(msg) {
  clearTimeout(toastT); toastEl.textContent = msg; toastEl.hidden = false;
  toastEl.classList.remove('in'); void toastEl.offsetWidth; toastEl.classList.add('in');
  toastT = setTimeout(() => { toastEl.classList.remove('in'); toastT = setTimeout(() => { toastEl.hidden = true; }, 300); }, 2200);
}
function link(el, url, later) {
  if (!el) return;
  if (url) { el.href = url; el.target = '_blank'; el.rel = 'noopener'; }
  else { el.href = '#'; el.addEventListener('click', (e) => { e.preventDefault(); toast(later); }); }
}
link($('buy'), buyUrl, 'buying opens at launch.');
link($('chartLink'), chartUrl, 'the chart goes live at launch.');
link($('xLink'), xUrl, 'X drops at launch.');
for (const el of document.querySelectorAll('[data-ticker]')) el.textContent = '$' + T;
const caTxt = $('caTxt');
if (CA) caTxt.textContent = CA.slice(0, 4) + '…' + CA.slice(-4);
async function copyCA() {
  if (!CA) { toast('CA drops at launch.'); return; }
  try { await navigator.clipboard.writeText(CA); toast('CA copied.'); }
  catch (e) { caTxt.textContent = CA; const r = document.createRange(); r.selectNodeContents(caTxt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('select + copy the CA.'); }
}
$('caChip').addEventListener('click', copyCA);

/* ---------- access log ---------- */
const rows = $('rows');
const LOG = [
  ['/roadmap', 404, 'not found'], ['/utility', 404, 'not found'], ['/whitepaper', 404, 'not found'],
  ['/team', 404, "we're lost too"], ['/plan', 404, 'not found'], ['/sleep', 404, 'not found'],
  ['/exit', 404, 'not found'],
  ['/buy', 200, 'ok', 'buy'], ['/chart', 200, 'ok', 'chart'], ['/x', 200, 'ok', 'x'], ['/ca', 200, 'ok', 'ca'],
];
const pad2 = (n) => String(n).padStart(2, '0');
function stamp(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
const base = Date.now();
LOG.forEach(([path, st, note, kind], i) => {
  const ok = st === 200;
  const el = document.createElement(ok ? 'a' : 'li');
  el.className = 'row ' + (ok ? 'o' : 'e');
  const when = new Date(base - (LOG.length - i) * 1000);
  el.innerHTML = `<span class="t">${stamp(when)}</span><span class="p">GET <b>${path}</b></span><span class="s">${st}</span><span class="n">${note}</span>`;
  if (ok) {
    if (kind === 'buy') link(el, buyUrl, 'buying opens at launch.');
    else if (kind === 'chart') link(el, chartUrl, 'the chart goes live at launch.');
    else if (kind === 'x') link(el, xUrl, 'X drops at launch.');
    else { el.href = '#'; el.addEventListener('click', (e) => { e.preventDefault(); copyCA(); }); }
    el.setAttribute('role', 'link');
    const wrap = document.createElement('li'); wrap.appendChild(el); wrap.style.listStyle = 'none'; rows.appendChild(wrap);
  } else rows.appendChild(el);
});
const rowEls = [...rows.querySelectorAll('.row')];
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) {
      const i = rowEls.indexOf(e.target);
      setTimeout(() => e.target.classList.add('in'), (i % 6) * 70);
      io.unobserve(e.target);
    }
  }, { threshold: .2 });
  rowEls.forEach((r) => io.observe(r));
} else rowEls.forEach((r) => r.classList.add('in'));
setInterval(() => { $('clock').textContent = stamp(new Date()); }, 1000);
$('clock').textContent = stamp(new Date());

/* ---------- error windows ---------- */
const wins = $('wins');
const MSG = [
  ['page not found.', ''], ['roadmap not found.', 'looked everywhere'], ['utility not found.', ''],
  ['whitepaper not found.', 'try /whitepaper.pdf'], ["team not found.", "we're lost too"],
  ['plan not found.', ''], ['sleep not found.', 'last seen: october'], ['your exit not found.', 'checked the pockets'],
  ['tokenomics not found.', ''], ['patience not found.', ''],
];
const BYE = ['ok fine.', 'only /buy exists.'];
let spawned = 0, live = [], z = 1;
function closeWin(w) { const i = live.indexOf(w); if (i >= 0) live.splice(i, 1); w.remove(); }
function spawn(x, y) {
  if (spawned >= MSG.length) { collapse(); return; }
  const [m, sub] = MSG[spawned++];
  const w = document.createElement('div'); w.className = 'win'; w.style.zIndex = ++z;
  w.innerHTML = `<div class="tb"><span>404.exe</span><button class="x" type="button" aria-label="close">×</button></div><div class="bd"><div class="ic">!</div><div class="msg">${m}${sub ? `<small>${sub}</small>` : ''}</div></div><button class="ok" type="button">OK</button>`;
  wins.appendChild(w);
  const W = w.offsetWidth || 280, H = w.offsetHeight || 120;
  const vw = innerWidth, vh = innerHeight;
  w.style.left = Math.max(8, Math.min(vw - W - 8, x - W / 2 + (Math.random() - .5) * 40)) + 'px';
  w.style.top = Math.max(60, Math.min(vh - H - 8, y - H / 2 + (Math.random() - .5) * 40)) + 'px';
  live.push(w);
  if (live.length > 7) closeWin(live[0]);
  w.querySelector('.x').addEventListener('click', (e) => { e.stopPropagation(); closeWin(w); });
  w.querySelector('.ok').addEventListener('click', (e) => { e.stopPropagation(); closeWin(w); });
  const tb = w.querySelector('.tb'); let dx = 0, dy = 0, drag = false;
  tb.addEventListener('pointerdown', (e) => { if (e.target.closest('.x')) return; drag = true; w.style.zIndex = ++z; dx = e.clientX - w.offsetLeft; dy = e.clientY - w.offsetTop; tb.setPointerCapture(e.pointerId); tb.style.cursor = 'grabbing'; e.stopPropagation(); });
  tb.addEventListener('pointermove', (e) => { if (!drag) return; w.style.left = (e.clientX - dx) + 'px'; w.style.top = (e.clientY - dy) + 'px'; });
  const up = () => { drag = false; tb.style.cursor = ''; };
  tb.addEventListener('pointerup', up); tb.addEventListener('pointercancel', up);
  w.addEventListener('pointerdown', (e) => { w.style.zIndex = ++z; e.stopPropagation(); });
  burst = 1;
}
function collapse() {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (const w of live) {
    w.classList.add('dying');
    const r = w.getBoundingClientRect();
    w.style.transform = `translate(${cx - r.left - r.width / 2}px,${cy - r.top - r.height / 2}px) scale(.2)`;
  }
  burst = 1.6;
  setTimeout(() => { live.slice().forEach(closeWin); }, 520);
  const [a, b] = BYE;
  setTimeout(() => toast(a + ' ' + b), 540);
  spawned = 0;
}

/* ---------- hero: 2D source -> WebGL glitch ---------- */
const hero = $('hero'), gl = $('gl'), src = $('src'), sx = src.getContext('2d');
let W = 0, H = 0, scale = Math.min(devicePixelRatio || 1, 1.5), burst = 0, autoBurst = 0, nextAuto = 1.2;
let mx = .5, my = .5, hov = 0, px = 0, py = 0, tx = 0, ty = 0, lastInput = -99, t0 = performance.now();
let GL = null, tex = null, uni = {}, glOk = false;

function size() {
  const w = hero.clientWidth, h = hero.clientHeight;
  if (!w || !h) return false;
  const nw = Math.round(w * scale), nh = Math.round(h * scale);
  if (nw !== W || nh !== H) { W = src.width = gl.width = nw; H = src.height = gl.height = nh; if (GL) GL.viewport(0, 0, W, H); }
  return true;
}

function drawSrc(t) {
  const c = sx; c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const fs = Math.min(W * (W < 700 ? .44 : .36), H * .46);
  c.font = `400 ${fs}px "Archivo Black",Impact,"Arial Black",sans-serif`;
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  const w4 = c.measureText('4').width, w0 = c.measureText('0').width, w = w4 * 2 + w0;
  const ox = px * W * .018, oy = py * H * .016;
  const x0 = W / 2 - w / 2 + ox, baseY = H * .41 + fs * .36 + oy;
  c.fillStyle = '#fff'; c.fillText('404', x0, baseY);
  // tears from the two 4s
  c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = Math.max(2, fs * .042);
  [x0 + w4 * .24, x0 + w4 + w0 + w4 * .24].forEach((tx0, k) => {
    const y0 = baseY - fs * .24, L = fs * (.46 + .14 * Math.sin(t * 1.4 + k * 2.1));
    c.beginPath();
    for (let i = 0; i <= 16; i++) { const f = i / 16, yy = y0 + f * L, xx = tx0 + Math.sin(f * 7 + t * 3 + k) * fs * .014 * f; i ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }
    c.stroke();
  });
  // sad frown under the zero
  const cx = x0 + w4 + w0 / 2, r = fs * .17, cy = baseY + fs * .07 + r;
  c.fillStyle = '#fff'; c.beginPath(); c.arc(cx + ox * .6, cy, r, 0, 7); c.fill();
  c.strokeStyle = '#000'; c.lineWidth = Math.max(2, fs * .034);
  c.beginPath(); c.arc(cx + ox * .6, cy + r * .42, r * .5, Math.PI * 1.14, Math.PI * 1.86); c.stroke();
}

const VS = 'attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS = `precision mediump float;varying vec2 v;uniform sampler2D t;uniform vec2 res;uniform vec2 m;uniform float time,burst,hov;
float h(float n){return fract(sin(n*91.345)*47453.5453);}
void main(){
 vec2 uv=v;
 float near=exp(-pow((uv.y-m.y)*6.0,2.0))*hov;
 float g=clamp(burst+near*.55,0.,2.);
 float row=floor(uv.y*46.0);
 float tk=floor(time*14.0);
 float gate=step(.58,h(row+tk*3.1));
 float off=(h(row*1.7+tk)-.5)*.14*g*gate;
 vec2 u=uv+vec2(off,0.);
 float ca=.0016+.011*g;
 float r=texture2D(t,u+vec2(ca,0.)).r,gg=texture2D(t,u).g,b=texture2D(t,u-vec2(ca,0.)).b;
 vec3 c=vec3(r,gg,b);
 float band=smoothstep(.0,.05,fract(uv.y*.8-time*.06))*(1.-smoothstep(.05,.1,fract(uv.y*.8-time*.06)));
 c+=band*.05;
 c*=.93+.07*sin(uv.y*res.y*1.4+time*2.);
 c+=(h(uv.x*res.x+uv.y*res.y*7.+time)-.5)*.07;
 float vg=smoothstep(1.15,.35,length((uv-.5)*vec2(1.,.9)));
 gl_FragColor=vec4(c*mix(.55,1.,vg),1.);
}`;

function initGL() {
  try {
    GL = gl.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
    if (!GL) return false;
    const mk = (type, s) => { const o = GL.createShader(type); GL.shaderSource(o, s); GL.compileShader(o); if (!GL.getShaderParameter(o, GL.COMPILE_STATUS)) throw new Error(GL.getShaderInfoLog(o)); return o; };
    const pr = GL.createProgram(); GL.attachShader(pr, mk(GL.VERTEX_SHADER, VS)); GL.attachShader(pr, mk(GL.FRAGMENT_SHADER, FS)); GL.linkProgram(pr);
    if (!GL.getProgramParameter(pr, GL.LINK_STATUS)) throw new Error('link');
    GL.useProgram(pr);
    const buf = GL.createBuffer(); GL.bindBuffer(GL.ARRAY_BUFFER, buf);
    GL.bufferData(GL.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), GL.STATIC_DRAW);
    const loc = GL.getAttribLocation(pr, 'p'); GL.enableVertexAttribArray(loc); GL.vertexAttribPointer(loc, 2, GL.FLOAT, false, 0, 0);
    tex = GL.createTexture(); GL.bindTexture(GL.TEXTURE_2D, tex);
    GL.pixelStorei(GL.UNPACK_FLIP_Y_WEBGL, true);
    GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_MIN_FILTER, GL.LINEAR); GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_MAG_FILTER, GL.LINEAR);
    GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_S, GL.CLAMP_TO_EDGE); GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_T, GL.CLAMP_TO_EDGE);
    for (const n of ['res', 'm', 'time', 'burst', 'hov']) uni[n] = GL.getUniformLocation(pr, n);

}

let last = performance.now(), slow = 0, frames = 0, started = false;
function frame(now) {

  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!size()) return;

  // idle wander
  const idle = t - lastInput > 5;
  if (idle) { tx = Math.sin(t * .5) * 1.2; ty = Math.sin(t * .37 + 1) * .8; }
  px += (tx - px) * Math.min(1, dt * 4); py += (ty - py) * Math.min(1, dt * 4);
  // bursts
  nextAuto -= dt; if (nextAuto <= 0) { autoBurst = .55 + Math.random() * .4; nextAuto = 2 + Math.random() * 3.5; }
  autoBurst = Math.max(0, autoBurst - dt * 5); burst = Math.max(0, burst - dt * 2.4);
  hov += (((t - lastInput) < 1.2 ? 1 : 0) - hov) * Math.min(1, dt * 6);
  drawSrc(t);
  if (glOk) {
    GL.bindTexture(GL.TEXTURE_2D, tex);
    GL.texImage2D(GL.TEXTURE_2D, 0, GL.RGBA, GL.RGBA, GL.UNSIGNED_BYTE, src);
    GL.uniform2f(uni.res, W, H); GL.uniform2f(uni.m, mx, my); GL.uniform1f(uni.time, t);
    GL.uniform1f(uni.burst, Math.max(burst, autoBurst)); GL.uniform1f(uni.hov, hov);

  if (!started) { started = true; document.body.classList.add('ready'); }
  // degrade
  if (dt > .034) slow++; else slow = Math.max(0, slow - 1);
  if (slow > 50 && scale > .6) { scale = Math.max(.6, scale * .8); slow = 0; }
}

function input(e) {
  const r = hero.getBoundingClientRect();
  const cx = (e.clientX ?? 0) - r.left, cy = (e.clientY ?? 0) - r.top;
  mx = Math.min(1, Math.max(0, cx / r.width)); my = 1 - Math.min(1, Math.max(0, cy / r.height));
  tx = (mx - .5) * 2; ty = -(my - .5) * 2;

hero.addEventListener('pointermove', input, { passive: true });
hero.addEventListener('pointerdown', (e) => {
  if (e.target.closest('a,button,.win')) return;
  input(e); spawn(e.clientX, e.clientY);
});
// first win on load shortly after the page settles, like a real browser error
function boot() {
  glOk = initGL();
  if (!glOk) document.body.classList.add('nogl');
  size();
  requestAnimationFrame(() => requestAnimationFrame(frame));
  setTimeout(() => { if (!started) { document.body.classList.add('nogl'); glOk = false; requestAnimationFrame(frame); } }, 3000);
}
if (document.fonts && document.fonts.load) {
  Promise.race([document.fonts.load('400 100px "Archivo Black"'), new Promise((r) => setTimeout(r, 1500))]).then(() => setTimeout(boot, 0), () => setTimeout(boot, 0));
} else boot();
window.__f404 = { spawn, collapse, get live() { return live.length; }, get glOk() { return glOk; }, get frames() { return frames; } };
})();
